<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>圓錐曲線 3D 精確解析教具</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { margin: 0; overflow: hidden; background: #fff; font-family: system-ui, sans-serif; color: #1e293b; }

        .main-title {
            position: absolute; top: 0; left: 0; z-index: 100;
            width: 210px; height: 75px; padding: 18px 0 0 18px;
            background: #fff; font-size: 1.5em; font-weight: bold; color: #0f766e;
            text-shadow: none; pointer-events: none;
        }

        .preset-group { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 15px; }
        .preset-btn {
            flex: 1 1 calc(50% - 6px); background: #fff; border: 1px solid #cbd5e1; color: #0f766e;
            font-size: 11px; padding: 8px 2px; cursor: pointer; border-radius: 4px;
        }
        .preset-btn:hover { background: #f0fdfa; border-color: #0f766e; }
        .preset-btn:active { background: #0f766e; color: #fff; }
        .reset-btn { background: #0f766e; color: #fff; font-weight: bold; border: 1px solid #0f766e; }

        .reset-btn:hover { background: #115e59; color: #fff; }

        #ui {
            position: absolute; top: 0; left: 0; bottom: 0;
            background: #fff; padding: 75px 12px 12px 12px;
            width: 210px; border-right: 1px solid #cbd5e1; z-index: 10; overflow-y: auto;
        }
        .section-title {
            font-size: 0.85em; color: #475569; margin-bottom: 12px;
            border-left: 2px solid #0f766e; padding-left: 8px; font-weight: bold;
        }
        .type-label { font-size: 1.2em; color: #0f766e; text-align: center; font-weight: bold; padding: 10px; border-bottom: 1px solid #e2e8f0; }
        .param-group { margin-bottom: 15px; border-bottom: 1px solid #e2e8f0; padding-bottom: 12px; }
        .label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        label { font-size: 11px; color: #64748b; }
        input[type=number] { width: 55px; background: #fff; border: 1px solid #cbd5e1; color: #0f766e; border-radius: 3px; padding: 2px; font-size: 11px; }

        .custom-slider { position: relative; width: 100%; height: 24px; display: flex; align-items: center; touch-action: pan-y; }
        .slider-track { position: absolute; width: 100%; height: 2px; background: #e2e8f0; border-radius: 1px; pointer-events: none; }
        .slider-thumb { position: absolute; width: 14px; height: 14px; background: #0f766e; border-radius: 50%; cursor: grab; left: 0; transform: translateX(-50%); z-index: 5; touch-action: none; }

        .param-group.unimportant label { color: #555 !important; }
        .param-group.unimportant .slider-thumb { background: #555 !important; }
        .param-group.unimportant input[type=number] { color: #555 !important; border-color: #333 !important; }

        #company-logo { position: absolute; top: 15px; right: 15px; width: 70px; z-index: 110; pointer-events: none; }

        #preview-box {
            position: absolute; bottom: 20px; right: 20px;
            background: #fff;
            border-radius: 8px; border: 1px solid #cbd5e1; z-index: 5;
            display: flex; flex-direction: column; overflow: hidden;
        }

        #preview-container {
            flex: 1; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 10px;
        }

        @media (max-width: 768px) {
            .main-title { width: auto; height: auto; background: none; left: 15px; top: 15px; font-size: 1.2em; padding: 0; }
            #company-logo { width: 45px; }
            #ui { top: 65vh; left: 0; width: 60%; height: 35vh; bottom: 0; background: #fff; padding: 10px 8px 30px 8px; }
            #preview-box { top: 65vh; right: 0; left: auto; bottom: 0; width: 40%; height: 35vh; background: #fff; border-radius: 0; border: none; border-top: 1px solid #e2e8f0; border-left: 1px solid #e2e8f0; display: flex; flex-direction: column; }
            #preview-container { flex: 1; padding: 2px 4px; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 0; }
            #preview-container > div:first-child { display: none; }
            .type-label { font-size: 0.85em; padding: 3px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            .slider-thumb { width: 20px; height: 20px; }
            #pCanvas { display: block; width: auto !important; height: auto !important; max-width: 90% !important; max-height: 80% !important; aspect-ratio: 1 / 1; }
        }
    </style>
</head>
<body>

<div class="main-title">圓錐曲線模型</div>

<div id="ui">
    <div class="section-title">快速切換</div>
    <div class="preset-group">
        <button class="preset-btn reset-btn" onclick="applyPreset(30, 90, 2.0, 0, 0, 0)">RESET</button>
        <button class="preset-btn" onclick="applyPreset(30, 60, 0.0, 0, 0, 0)">一個點</button>
        <button class="preset-btn" onclick="applyPreset(30, 90, 4.0, 0, 0, 0)">圓形</button>
        <button class="preset-btn" onclick="applyPreset(30, 60, 4.0, 0, 0, 0)">橢圓形</button>
        <button class="preset-btn" onclick="applyPreset(30, 30, 4.0, 0, 0, 0)">拋物線</button>
        <button class="preset-btn" onclick="applyPreset(30, 15, 2.0, 0, 0, 0)">雙曲線</button>
        <button class="preset-btn" onclick="applyPreset(30, 30, 0.0, 0, 0, 0)">一條直線</button>
        <button class="preset-btn" onclick="applyPreset(30, 15, 0.0, 0, 0, 0)">兩相交線</button>
    </div>

    <div class="section-title">數據設定<br><span style="font-size:0.85em; font-weight:normal; color:#64748b;">（最多至小數點後兩位）</span></div>
    <div class="param-group" data-id="alpha" data-min="5" data-max="85">
        <div class="label-row"><label>母線夾角 (α):</label><input type="number" id="alphaN" value="30"></div>
        <div class="custom-slider"><div class="slider-track"></div><div class="slider-thumb"></div></div>
    </div>
    <div class="param-group" data-id="beta" data-min="0" data-max="180">
        <div class="label-row"><label>平面夾角 (β):</label><input type="number" id="betaN" value="90"></div>
        <div class="custom-slider"><div class="slider-track"></div><div class="slider-thumb"></div></div>
    </div>
    <div class="param-group" data-id="y" data-min="-10" data-max="10">
        <div class="label-row"><label>平面位移 (Z):</label><input type="number" id="yN" value="2.0"></div>
        <div class="custom-slider"><div class="slider-track"></div><div class="slider-thumb"></div></div>
    </div>
    <div class="param-group" data-id="z" data-min="-10" data-max="10">
        <div class="label-row"><label>平面位移 (Y):</label><input type="number" id="zN" value="0.0"></div>
        <div class="custom-slider"><div class="slider-track"></div><div class="slider-thumb"></div></div>
    </div>
    <div class="param-group" data-id="x" data-min="-10" data-max="10">
        <div class="label-row"><label>平面位移 (X):</label><input type="number" id="xN" value="0.0"></div>
        <div class="custom-slider"><div class="slider-track"></div><div class="slider-thumb"></div></div>
    </div>
    <div class="param-group unimportant" data-id="coneY" data-min="-5" data-max="5">
        <div class="label-row"><label>圓錐位置 (Z):</label><input type="number" id="coneYN" value="0"></div>
        <div class="custom-slider"><div class="slider-track"></div><div class="slider-thumb"></div></div>
    </div>
</div>

<img id="company-logo" src="company-logo.png" alt="Company Logo">

<div id="preview-box">
    <div class="type-label" id="curveType">圓</div>
    <div id="preview-container">
        <div style="font-size: 10px; margin-bottom:8px; text-align:center; color:#64748b; letter-spacing: 1px;">截面圖形</div>
        <canvas id="pCanvas" width="220" height="220"></canvas>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    document.body.appendChild(renderer.domElement);
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    scene.add(new THREE.GridHelper(30, 60, 0x64748b, 0xcbd5e1));
    let topCone, bottomCone;
    const coneGroup = new THREE.Group(); scene.add(coneGroup);
    const coneMat = new THREE.MeshPhongMaterial({ color: 0x1d4ed8, transparent: true, opacity: 0.5, side: THREE.DoubleSide });
    const planeGroup = new THREE.Group();
    const planeMesh = new THREE.Mesh(new THREE.PlaneGeometry(35,35), new THREE.MeshPhongMaterial({color:0x9f4050, side:THREE.DoubleSide, transparent:true, opacity:0.46}));
    planeMesh.rotation.x = Math.PI/2; planeGroup.add(planeMesh); scene.add(planeGroup);
    // 座標軸：完整雙向延伸，正方向加箭頭，低調灰色半透明
    const axisMatXY = new THREE.LineBasicMaterial({ color: 0x334155, transparent: true, opacity: 0.7, depthTest: false });
    const axisMatZ  = new THREE.LineBasicMaterial({ color: 0x334155, transparent: true, opacity: 0.7 });

    function makeFullAxis(posDir, len, mat) {
        const neg = posDir.clone().multiplyScalar(-len);
        const pos = posDir.clone().multiplyScalar(len);
        const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([neg, pos]), mat);
        line.renderOrder = 1;
        return line;
    }
    scene.add(makeFullAxis(new THREE.Vector3(1,0,0), 15, axisMatXY));
    scene.add(makeFullAxis(new THREE.Vector3(0,0,1), 15, axisMatXY));
    scene.add(makeFullAxis(new THREE.Vector3(0,1,0), 13, axisMatZ));

    // 箭頭：XY軸關閉 depthTest 確保不被平面擋住
    function makeArrow(position, direction, noDepth) {
        const geo = new THREE.ConeGeometry(0.13, 0.55, 8);
        const mat = new THREE.MeshBasicMaterial({ color: 0x334155, transparent: true, opacity: 0.75, depthTest: !noDepth });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), direction.clone().normalize());
        mesh.position.copy(position);
        mesh.renderOrder = 2;
        return mesh;
    }
    scene.add(makeArrow(new THREE.Vector3(15, 0, 0),  new THREE.Vector3(1,0,0), true));
    scene.add(makeArrow(new THREE.Vector3(0, 0, 15),  new THREE.Vector3(0,0,1), true));
    scene.add(makeArrow(new THREE.Vector3(0, 13, 0),  new THREE.Vector3(0,1,0), false));

    function makeAxisLabel(text, noDepth) {
        const c = document.createElement('canvas'); c.width = 64; c.height = 64;
        const ctx = c.getContext('2d');
        ctx.fillStyle = 'rgba(71,85,105,0.9)'; ctx.font = 'bold 40px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(text, 32, 32);
        const tex = new THREE.CanvasTexture(c);
        const mat = new THREE.SpriteMaterial({ map: tex, depthTest: !noDepth, transparent: true, opacity: 0.9 });
        const sprite = new THREE.Sprite(mat); sprite.scale.set(1, 1, 1);
        sprite.renderOrder = 3;
        return sprite;
    }
    const lx = makeAxisLabel('X', true);  lx.position.set(16, 0, 0);  scene.add(lx);
    const ly = makeAxisLabel('Y', true);  ly.position.set(0, 0, 16);  scene.add(ly);
    const lz = makeAxisLabel('Z', false); lz.position.set(0, 14, 0);  scene.add(lz);

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const light = new THREE.PointLight(0xffffff, 1); light.position.set(10, 20, 10); scene.add(light);
    const paramData = { coneY: 0 };

    function handleResize() {
        const width = window.innerWidth, height = window.innerHeight, isMob = width <= 768;
        const uiWidth = isMob ? 0 : 210, uiHeight = isMob ? (height * 0.35) : 0;
        const visibleWidth = width - uiWidth, visibleHeight = height - uiHeight;
        renderer.setSize(width, height);
        renderer.setViewport(uiWidth, uiHeight, visibleWidth, visibleHeight);
        renderer.setScissor(uiWidth, uiHeight, visibleWidth, visibleHeight);
        renderer.setScissorTest(true);
        camera.aspect = visibleWidth / visibleHeight; camera.updateProjectionMatrix();
        if (isMob) camera.position.set(32, 22, 32); else camera.position.set(25, 18, 25);
    }

    document.querySelectorAll('.param-group').forEach(group => {
        const id = group.dataset.id, min = parseFloat(group.dataset.min), max = parseFloat(group.dataset.max);
        const thumb = group.querySelector('.slider-thumb'), numInput = group.querySelector('input[type=number]');
        paramData[id] = parseFloat(numInput.value);
        const updateUI = (val) => { thumb.style.left = ((val - min) / (max - min) * 100) + '%'; };
        const move = (clientX) => {
            const rect = thumb.parentElement.getBoundingClientRect();
            let off = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
            paramData[id] = Math.round((min + off * (max - min)) * 100) / 100;
            numInput.value = paramData[id]; updateUI(paramData[id]); update();
        };
        thumb.addEventListener('touchstart', (e) => e.stopPropagation());
        thumb.addEventListener('touchmove', (e) => { e.preventDefault(); e.stopPropagation(); move(e.touches[0].clientX); }, {passive:false});
        let drag = false;
        thumb.addEventListener('mousedown', () => drag = true);
        window.addEventListener('mousemove', (e) => { if(drag) move(e.clientX); });
        window.addEventListener('mouseup', () => drag = false);
        numInput.addEventListener('input', () => {
            // 限制小數點後最多兩位，超過直接截斷
            const raw = numInput.value;
            const dot = raw.indexOf('.');
            if (dot !== -1 && raw.length - dot > 3) {
                numInput.value = parseFloat(raw).toFixed(2);
            }
        });
        numInput.addEventListener('change', () => {
            let val = Math.round(parseFloat(numInput.value) * 100) / 100;
            val = Math.max(min, Math.min(max, val));
            numInput.value = val;
            paramData[id] = val; updateUI(val); update();
        });
        updateUI(paramData[id]);
    });

    window.applyPreset = function(a, b, y, x, z, cy) {
        const vals = {alpha:a, beta:b, y:y, x:x, z:z, coneY:cy};
        for(let id in vals) {
            paramData[id] = vals[id];
            const n = document.getElementById(id + 'N'); if(n) n.value = vals[id];
            const g = document.querySelector(`.param-group[data-id="${id}"]`);
            if(g) { const min=parseFloat(g.dataset.min), max=parseFloat(g.dataset.max); g.querySelector('.slider-thumb').style.left = ((vals[id]-min)/(max-min)*100)+'%'; }
        }
        update();
    };

    function update() {
        const a = paramData.alpha, b = paramData.beta, px = paramData.x, py = paramData.y, pz = paramData.z, cy = paramData.coneY;
        coneGroup.position.y = cy;
        if (topCone) { coneGroup.remove(topCone); coneGroup.remove(bottomCone); }
        const radA = a * Math.PI/180, h = 12, geom = new THREE.ConeGeometry(h*Math.tan(radA), h, 128, 1, true);
        geom.translate(0, -h/2, 0); topCone = new THREE.Mesh(geom, coneMat); bottomCone = new THREE.Mesh(geom, coneMat); bottomCone.rotation.x = Math.PI;
        coneGroup.add(topCone, bottomCone);
        const radB_rot = (90 - b) * (Math.PI/180);
        planeGroup.rotation.x = radB_rot; planeGroup.position.set(px, py, pz);

        // 平面法向量（繞X軸旋轉，法向量在YZ平面）
        const ny = Math.cos(radB_rot), nz = Math.sin(radB_rot);
        // 正確dist：頂點(0,cy,0)到平面的有號距離，法向量已單位化
        // 平面通過(px,py,pz)，法向量(0,ny,nz)
        // dist = ny*(cy - py) + nz*(0 - pz)
        const dist = Math.abs(ny * (cy - py) - nz * pz);

        // passV：只看Y和Z位移是否讓平面通過頂點，X不影響截面形狀
        const passV = dist < 0.001;

        // eb：平面與圓錐軸的夾角（等效，取0~90範圍）
        const eb = b > 90 ? 180 - b : b;
        // 角度比較精確到小數點後兩位
        const ebR = Math.round(eb * 100), aR = Math.round(a * 100);
        let type;
        if (passV) {
            // 平面過頂點：只看角度
            if (ebR === aR)  type = "一條直線";   // eb = α → 平行母線
            else if (eb > a) type = "一個點";      // eb > α → 只切頂點
            else             type = "兩相交直線";  // eb < α → 切出兩條交線
        } else {
            // 平面不過頂點
            if (ebR === 9000)  type = "圓";         // β = 90° → 水平切面
            else if (eb > a)   type = "橢圓形";     // α < eb < 90°
            else if (ebR===aR) type = "拋物線";     // eb = α → 平行母線
            else               type = "雙曲線";     // eb < α
        }
        document.getElementById('curveType').innerText = type; draw2D(type, a, eb, dist);
    }

    function draw2D(type, aDeg, bDeg, dist) {
        const canvas = document.getElementById('pCanvas'), ctx = canvas.getContext('2d');
        ctx.clearRect(0,0,220,220); ctx.strokeStyle = "#0f766e"; ctx.lineWidth = 3.5; ctx.fillStyle = "#0f766e";
        const mid = 110, scale = 25, alpha = aDeg * Math.PI/180, beta = bDeg * Math.PI/180;

        if (type === "圓") {
            ctx.beginPath(); ctx.arc(mid, mid, Math.max(0.5, Math.abs(dist * Math.tan(alpha) * scale)), 0, Math.PI*2); ctx.stroke();
        }
        else if (type === "一個點") {
            ctx.beginPath(); ctx.arc(mid, mid, 6, 0, Math.PI*2); ctx.fill();
        }
        else if (type === "一條直線") {
            ctx.beginPath(); ctx.moveTo(mid, 20); ctx.lineTo(mid, 200); ctx.stroke();
        }
        else if (type === "兩相交直線") {
            ctx.beginPath();
            const s = Math.tan(alpha);
            ctx.moveTo(mid-100, mid-100*s); ctx.lineTo(mid+100, mid+100*s);
            ctx.moveTo(mid+100, mid-100*s); ctx.lineTo(mid-100, mid+100*s);
            ctx.stroke();
        }
        else if (type === "橢圓形") {
            ctx.beginPath();
            const denom = Math.pow(Math.sin(beta),2) - Math.pow(Math.sin(alpha),2);
            if (denom > 0.0001) {
                // 正確幾何推導：a為長軸（沿傾斜方向），b為短軸（垂直方向）
                const a = Math.abs(dist * Math.sin(alpha) * Math.cos(alpha) / denom);
                const b = Math.abs(dist * Math.sin(alpha) / Math.sqrt(denom));
                ctx.ellipse(mid, mid, Math.min(90, a*scale), Math.min(90, b*scale), 0, 0, Math.PI*2);
                ctx.stroke();
            }
        }
        else if (type === "拋物線") {
            ctx.beginPath();
            const p = Math.abs(dist * Math.sin(alpha));
            let f = true;
            for(let y = -95; y <= 95; y++) {
                const x = (y*y) / (4 * (p < 0.1 ? 0.1 : p) * scale);
                if(f) { ctx.moveTo(mid + x, mid + y); f = false; } else ctx.lineTo(mid + x, mid + y);
            }
            ctx.stroke();
        }
        else if (type === "雙曲線") {
            const drawBranch = (s) => {
                ctx.beginPath();
                let f = true;
                const e = Math.cos(beta) / Math.cos(alpha);
                const aMath = Math.abs(dist * Math.cos(alpha)*Math.sin(alpha) / (Math.pow(Math.sin(alpha),2) - Math.pow(Math.sin(beta),2)));
                const bMath = aMath * Math.sqrt(Math.max(0, Math.abs(e*e - 1)));
                // 轉換為像素單位，確保不混用數學單位與像素
                const aP = Math.max(8, aMath * scale);
                const bP = Math.max(8, bMath * scale);
                for(let yPx = -95; yPx <= 95; yPx++) {
                    const xPx = aP * Math.sqrt(1 + Math.pow(yPx / bP, 2));
                    if(f) { ctx.moveTo(mid + s * xPx, mid + yPx); f = false; }
                    else ctx.lineTo(mid + s * xPx, mid + yPx);
                }
                ctx.stroke();
            };
            drawBranch(1);
            drawBranch(-1);
        }
    }

    window.addEventListener('resize', handleResize);
    function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
    handleResize(); update(); animate();
</script>
</body>
</html>
